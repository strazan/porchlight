<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How it works</title>
<!--
  The README's "How it works" diagram, in the website's inks and type. To update
  docs/assets/how-it-works.png, render at 2x with headless Chrome:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --force-device-scale-factor=2 --default-background-color=00000000 --window-size=880,470 \
      --virtual-time-budget=4000 --screenshot=docs/assets/how-it-works.png design/how-it-works/index.html
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600&family=Courier+Prime:wght@400;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; }
  svg { display: block; }
  .title { font: 400 21px "Young Serif", Georgia, serif; fill: #26346e; }
  .title.light { fill: #fbf4e4; }
  .sub { font: 400 14px "Bricolage Grotesque", system-ui, sans-serif; fill: #4d5585; }
  .sub.light { fill: #e6dcc4; }
  .server { font: 400 16.5px "Courier Prime", monospace; fill: #26346e; }
  .edge { font: 700 14px "Courier Prime", monospace; fill: #26346e; }
  .edge.out { fill: #b5701a; }
  .zone { font: 600 12px "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: 0.14em; fill: #b5701a; }
</style>
</head>
<body>
<svg width="880" height="470" viewBox="0 0 880 470" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Slightly uneven edges, like a hand-cut block. -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2.2"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#26346e"/>
    </marker>
    <marker id="head-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d98a22"/>
    </marker>
  </defs>

  <!-- Paper (no grain: noise would make the PNG ten times bigger) -->
  <rect x="6" y="6" width="868" height="458" rx="20" fill="#f2ead6"/>

  <!-- Your Mac -->
  <rect x="28" y="196" width="824" height="248" rx="14" fill="none" stroke="#d98a22" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="zone" x="48" y="222">YOUR MAC</text>

  <g filter="url(#rough)">
    <!-- Cloud agents -->
    <rect x="46" y="48" width="236" height="92" rx="8" fill="#e9a23b" transform="translate(6 6)" style="mix-blend-mode:multiply"/>
    <rect x="46" y="48" width="236" height="92" rx="8" fill="#fffaf0" stroke="#26346e" stroke-width="2.5"/>
    <!-- Your relay -->
    <rect x="588" y="48" width="246" height="92" rx="8" fill="#e9a23b" transform="translate(6 6)" style="mix-blend-mode:multiply"/>
    <rect x="588" y="48" width="246" height="92" rx="8" fill="#fffaf0" stroke="#26346e" stroke-width="2.5"/>
    <!-- Porchlight -->
    <rect x="588" y="270" width="246" height="104" rx="8" fill="#e9a23b" transform="translate(6 6)" style="mix-blend-mode:multiply"/>
    <rect x="588" y="270" width="246" height="104" rx="8" fill="#26346e" stroke="#26346e" stroke-width="2.5"/>
    <!-- Servers -->
    <g fill="#fffaf0" stroke="#26346e" stroke-width="2">
      <rect x="64" y="244" width="232" height="40" rx="6"/>
      <rect x="64" y="292" width="232" height="40" rx="6"/>
      <rect x="64" y="340" width="232" height="40" rx="6"/>
      <rect x="64" y="388" width="232" height="40" rx="6"/>
    </g>
  </g>

  <text class="title" x="164" y="90" text-anchor="middle">Claude · ChatGPT</text>
  <text class="sub" x="164" y="114" text-anchor="middle">cloud agents</text>

  <text class="title" x="711" y="90" text-anchor="middle">Your relay</text>
  <text class="sub" x="711" y="114" text-anchor="middle">Cloudflare · your account</text>

  <image href="../../docs/assets/favicon-dark-192.png" x="608" y="290" width="62" height="62"/>
  <text class="title light" x="684" y="317">Porchlight</text>
  <text class="sub light" x="684" y="341">on your Mac</text>

  <g class="server">
    <text x="84" y="269">obsidian</text>
    <text x="84" y="317">filesystem</text>
    <text x="84" y="365">home-assistant</text>
    <text x="84" y="413">apple-reminders</text>
  </g>

  <!-- Cloud agents → relay -->
  <path d="M288 94 H578" stroke="#26346e" stroke-width="2.4" fill="none" marker-end="url(#head)"/>
  <rect x="356" y="68" width="160" height="22" rx="4" fill="#f2ead6"/>
  <text class="edge" x="436" y="84" text-anchor="middle">HTTPS + OAuth 2.1</text>

  <!-- Porchlight → relay: the Mac dials out -->
  <path d="M711 266 V152" stroke="#d98a22" stroke-width="3.2" fill="none" marker-end="url(#head-out)"/>
  <rect x="534" y="172" width="166" height="22" rx="4" fill="#f2ead6"/>
  <text class="edge out" x="696" y="188" text-anchor="end">outbound WebSocket</text>

  <!-- Porchlight → servers -->
  <g stroke="#26346e" stroke-width="2.2" fill="none">
    <path d="M584 322 H440"/>
    <path d="M440 264 V408"/>
    <path d="M440 264 H306" marker-end="url(#head)"/>
    <path d="M440 312 H306" marker-end="url(#head)"/>
    <path d="M440 360 H306" marker-end="url(#head)"/>
    <path d="M440 408 H306" marker-end="url(#head)"/>
  </g>
</svg>
</body>
</html>
