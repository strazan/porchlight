<!doctype html>
<!--
  README banner for Porchlight. A static print, generated from the landing page's closing artwork.
  Render (2x, transparent outside the torn edge):
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu --hide-scrollbars \
      --force-device-scale-factor=2 --default-background-color=00000000 --window-size=880,280 \
      --virtual-time-budget=5000 --screenshot=banner-raw.png "file://$PWD/design/banner/index.html"
  then reduce it to a palette PNG (~200 colours, keeping alpha) and save as docs/assets/banner.png.
-->

.words{position:absolute;left:452px;top:50px;color:#efe5cd;font-family:"Young Serif",Georgia,serif;z-index:3}
.mark{display:flex;align-items:center;gap:12px;font-size:46px;line-height:1;letter-spacing:-.01em}

    return g;

  // the marigold moth never joins the swarm: it idles out in the sky, and edges a little closer (curious) once the light is on
  function mothParams(i, sc, spread, home) {
    const side = i % 2 ? 1 : -1;
    return { R: (70 + i * 30 + rnd() * 30) * spread, ry: .55 + rnd() * .25, w: (rnd() < .5 ? -1 : 1) * (.45 + rnd() * .5), ph: rnd() * 6.3, p2: rnd() * 6.3, p3: rnd() * 6.3, s: sc * (.85 + rnd() * .35),
      hx: home ? home[0] : LAMP[0], hy: home ? home[1] : LAMP[1], ax: 38 + rnd() * 34, ay: 22 + rnd() * 22, f1: .22 + rnd() * .22, f2: .28 + rnd() * .24,

  // idle flight in the dark: a slow lazy loop around home, with a little flutter on top
  const wanderAt = (m, tt) => [
    m.hx + m.ax * Math.sin(tt * m.f1 + m.ph) + 9 * Math.sin(tt * 2.1 + m.p2) + 4 * Math.sin(tt * 5.3 + m.p3),

    if (since === -1) return wanderAt(m, tt);

  }


  const over = document.getElementById('over');
  const flock = makeFlock(over, 8, 2, 1.3);
